<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DON'T LOOK BACK IN HORROR</title>
  <meta name="description" content="A Thai supernatural night-shift taxi horror game. Made by Pukking Dragon." />
  <style>
    html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
